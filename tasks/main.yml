---
- name: Perform Open WebUI installation tasks
  when: open_webui_enabled | bool
  tags:
    - setup-all
    - setup-open-webui
    - install-all
    - install-open-webui
  block:
    - name: Validate Open WebUI configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Open WebUI
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Open WebUI uninstallation tasks
  when: not open_webui_enabled | bool
  tags:
    - setup-all
    - setup-open-webui
  block:
    - name: Uninstall Open WebUI
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
