---
# Project source code URL: https://github.com/open-webui/open-webui

open_webui_enabled: true

open_webui_identifier: open-webui
open_webui_base_path: "/{{ open_webui_identifier }}"
open_webui_data_path: "{{ open_webui_base_path }}/data"

# The path where the Python packages which tools and functions require are installed.
#
# Open WebUI installs the packages listed in the `requirements` of a tool's or function's frontmatter when it loads them.
# The container's own package directory belongs to `root`, and anything installed into the container is lost
# whenever it is recreated, so the packages are installed below this path instead (see `PYTHONUSERBASE` in `../templates/env.j2`).
open_webui_python_path: "{{ open_webui_base_path }}/python"

# The Python version of the container image.
# Python only looks for packages below `open_webui_python_path` if the directory for its version exists
# when Open WebUI starts, so the role creates it in advance. The Molecule scenarios check that this matches the image.
open_webui_python_version: "3.12"

# renovate: datasource=docker depName=ghcr.io/open-webui/open-webui versioning=semver
open_webui_version: 0.12.5

open_webui_uid: ""
open_webui_gid: ""

# The scheme used for serving Open WebUI.
open_webui_scheme: https

# The hostname at which Open WebUI is served.
open_webui_hostname: ""

# The path at which Open WebUI is served.
# Open WebUI does not support hosting under a subpath, so this value must be `/`.
open_webui_path_prefix: /

open_webui_container_image: "{{ open_webui_container_image_registry_prefix }}open-webui/open-webui:{{ open_webui_container_image_tag }}"
open_webui_container_image_tag: "{{ open_webui_version }}"
open_webui_container_image_registry_prefix: "{{ open_webui_container_image_registry_prefix_upstream }}"
open_webui_container_image_registry_prefix_upstream: "{{ open_webui_container_image_registry_prefix_upstream_default }}"
open_webui_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
open_webui_container_network: "{{ open_webui_identifier }}"

# Control if the container network is deleted on uninstalling.
open_webui_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `open_webui_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
open_webui_container_http_host_bind_port: ""

# The port number in the container
open_webui_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
open_webui_container_additional_networks: "{{ open_webui_container_additional_networks_auto + open_webui_container_additional_networks_custom }}"
open_webui_container_additional_networks_auto: []
open_webui_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
open_webui_container_additional_volumes: "{{ open_webui_container_additional_volumes_auto + open_webui_container_additional_volumes_custom }}"
open_webui_container_additional_volumes_auto: []
open_webui_container_additional_volumes_custom: []

# open_webui_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `open_webui_container_labels_additional_labels_custom`.
open_webui_container_labels_traefik_enabled: true
open_webui_container_labels_traefik_docker_network: "{{ open_webui_container_network }}"
open_webui_container_labels_traefik_hostname: "{{ open_webui_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/open-webui`).
open_webui_container_labels_traefik_path_prefix: "{{ open_webui_path_prefix }}"
open_webui_container_labels_traefik_rule: "Host(`{{ open_webui_container_labels_traefik_hostname }}`)"
open_webui_container_labels_traefik_priority: 0
open_webui_container_labels_traefik_entrypoints: web-secure
open_webui_container_labels_traefik_tls: "{{ open_webui_container_labels_traefik_entrypoints != 'web' }}"
open_webui_container_labels_traefik_tls_certResolver: default  # noqa var-naming
open_webui_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
open_webui_container_labels_traefik_middleware_basic_auth_users: ""

# Controls whether a compression middleware will be injected into the middlewares list.
# This compression middleware is supposed to be defined elsewhere (using labels or a File provider, etc.) and is merely referenced by this router.
open_webui_container_labels_traefik_compression_middleware_enabled: false
open_webui_container_labels_traefik_compression_middleware_name: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `open_webui_container_labels_traefik_additional_request_headers_custom`
open_webui_container_labels_traefik_additional_request_headers: "{{ open_webui_container_labels_traefik_additional_request_headers_auto | combine(open_webui_container_labels_traefik_additional_request_headers_custom) }}"
open_webui_container_labels_traefik_additional_request_headers_auto: {}
open_webui_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `open_webui_container_labels_traefik_additional_response_headers_custom`
open_webui_container_labels_traefik_additional_response_headers: "{{ open_webui_container_labels_traefik_additional_response_headers_auto | combine(open_webui_container_labels_traefik_additional_response_headers_custom) }}"
open_webui_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': open_webui_http_header_xss_protection} if open_webui_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': open_webui_http_header_content_type_options} if open_webui_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': open_webui_http_header_content_security_policy} if open_webui_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': open_webui_http_header_permissions_policy} if open_webui_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': open_webui_http_header_strict_transport_security} if open_webui_http_header_strict_transport_security and open_webui_container_labels_traefik_tls else {})
  }}
open_webui_container_labels_traefik_additional_response_headers_custom: {'X-Clacks-Overhead': GNU Terry Pratchett}

# open_webui_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `open_webui_container_labels_additional_labels_custom`
#
# Example:
# open_webui_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
open_webui_container_labels_additional_labels: "{{ open_webui_container_labels_additional_labels_auto + open_webui_container_labels_additional_labels_custom }}"
open_webui_container_labels_additional_labels_auto: []
open_webui_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume
open_webui_container_tmpfs_tmp_size: 512m

# Controls whether the container runs with a read-only filesystem (`--read-only`).
open_webui_container_read_only_enabled: true

# Specify the size of the tmpfs volume for Open WebUI's static files directory.
# Open WebUI rebuilds that directory inside its application directory from its frontend build on every start,
# so it has to be writable while the rest of the container's root filesystem is read-only.
# The tmpfs hides the Swagger UI files that the image ships there, which only the API documentation
# at `/docs` uses, and Open WebUI serves that only with `ENV=dev`.
open_webui_container_tmpfs_static_size: 32m

# A list of extra arguments to pass to the container (`docker create` command)
open_webui_container_extra_arguments: "{{ open_webui_container_extra_arguments_auto + open_webui_container_extra_arguments_custom }}"
open_webui_container_extra_arguments_auto: []
open_webui_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# They are passed to uvicorn, and replace the `--workers` and `--ws-per-message-deflate` arguments
# which the image's start script passes otherwise.
# Example: ['--SOME_ARGUMENT']
open_webui_process_extra_arguments: "{{ open_webui_process_extra_arguments_auto + open_webui_process_extra_arguments_custom }}"
open_webui_process_extra_arguments_auto: []
open_webui_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
open_webui_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
open_webui_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
open_webui_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
open_webui_http_header_permissions_policy: "{{ 'interest-cohort=()' if open_webui_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
open_webui_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if open_webui_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `open_webui_http_header_permissions_policy`
open_webui_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `open_webui_http_header_strict_transport_security`
open_webui_hsts_preload_enabled: false

# List of systemd services that the Open WebUI systemd service depends on
open_webui_systemd_required_services_list: "{{ open_webui_systemd_required_services_list_default + open_webui_systemd_required_services_list_auto + open_webui_systemd_required_services_list_custom }}"
open_webui_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
open_webui_systemd_required_services_list_auto: []
open_webui_systemd_required_services_list_custom: []

# List of systemd services that the Open WebUI systemd service wants
open_webui_systemd_wanted_services_list: "{{ open_webui_systemd_wanted_services_list_default + open_webui_systemd_wanted_services_list_auto + open_webui_systemd_wanted_services_list_custom }}"
open_webui_systemd_wanted_services_list_default: []
open_webui_systemd_wanted_services_list_auto: []
open_webui_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
open_webui_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
open_webui_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
open_webui_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
open_webui_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ open_webui_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ open_webui_container_stop_grace_time_seconds }} {{ open_webui_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ open_webui_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ open_webui_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ open_webui_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ open_webui_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ open_webui_identifier }} after {{ open_webui_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

########################################################################
#                                                                      #
# database                                                             #
#                                                                      #
########################################################################

# Specify a database driver to use
# Valid values: postgres, sqlite
open_webui_database_type: ""

# Specify database configuration
open_webui_database_hostname: ""
open_webui_database_port: 5432
open_webui_database_username: open_webui
open_webui_database_password: ""
# Specify SSL mode for Postgres database server
# By default, we expect a local container (without SSL), so attempting SSL connections is not necessary.
# Valid values: see https://www.postgresql.org/docs/11/libpq-ssl.html#LIBPQ-SSL-SSLMODE-STATEMENTS
open_webui_database_sslmode: disable
open_webui_database_name: open_webui

# Control if the database connection to Postgres is made via a Unix socket
open_webui_database_socket_enabled: true

# Specify the path to the Postgres Unix socket path inside the Open WebUI container
open_webui_database_socket_path_container: /run-postgres

# Specify the path to the Postgres Unix socket path on the host (bind-mount source)
open_webui_database_socket_path_host: ""

open_webui_environment_variables_database_url: |-
  postgresql://{{ open_webui_database_username }}:{{ open_webui_database_password }}@
  {%- if open_webui_database_socket_enabled -%}
  localhost/{{ open_webui_database_name }}?host={{ open_webui_database_socket_path_container }}
  {%- else -%}
  {{ open_webui_database_hostname }}:{{ open_webui_database_port }}/{{ open_webui_database_name }}?sslmode={{ open_webui_database_sslmode }}
  {%- endif -%}

########################################################################
#                                                                      #
# /database                                                            #
#                                                                      #
########################################################################

# Specify the URL at which Open WebUI is served.
# It is used in links that Open WebUI generates, such as OAuth redirect URLs.
open_webui_environment_variables_webui_url: "{{ open_webui_scheme }}://{{ open_webui_hostname }}"

# Specify the secret used for signing session tokens and encrypting sensitive data.
# Changing it signs every user out.
open_webui_environment_variables_webui_secret_key: ""

# Specify the origins allowed for cross-origin requests, separated by `;`.
open_webui_environment_variables_cors_allow_origin: "{{ open_webui_environment_variables_webui_url }}"

# Control whether the session cookie is only sent over HTTPS
open_webui_environment_variables_webui_session_cookie_secure: "{{ open_webui_scheme == 'https' }}"

# Control whether new users can sign up.
# The first user who signs up can always do so and becomes the administrator, after which Open WebUI
# turns sign-up off until it is turned on again in the admin panel (or, while
# `open_webui_environment_variables_enable_persistent_config` is disabled, until the next start).
open_webui_environment_variables_enable_signup: true

# Specify the role given to users who sign up
# Valid values: admin, pending, user
open_webui_environment_variables_default_user_role: pending

# Specify the administrator's account that Open WebUI creates on its first start, before anyone can sign up.
# It is created only while there are no users, and Open WebUI turns sign-up off afterwards.
# No account is created when the email address or the password is empty.
open_webui_environment_variables_webui_admin_email: ""
open_webui_environment_variables_webui_admin_password: ""
open_webui_environment_variables_webui_admin_name: Admin

# Specify the base URL of the Ollama API (e.g. `http://ollama:11434`).
# The connection to Ollama is disabled when this is empty.
open_webui_environment_variables_ollama_base_url: ""
open_webui_environment_variables_enable_ollama_api: "{{ open_webui_environment_variables_ollama_base_url != '' }}"

# Specify the base URL and the key of an OpenAI-compatible API.
# The base URL defaults to OpenAI's own API when only the key is set.
# The connection to an OpenAI-compatible API is disabled when both are empty.
open_webui_environment_variables_openai_api_base_url: ""
open_webui_environment_variables_openai_api_key: ""
open_webui_environment_variables_enable_openai_api: "{{ open_webui_environment_variables_openai_api_base_url != '' or open_webui_environment_variables_openai_api_key != '' }}"

# Control whether settings changed in the admin panel are stored in the database.
# While this is enabled, settings such as the URL, the connections and the signup options above are read from
# the environment only on the first start, and the values stored in the database are used afterwards.
open_webui_environment_variables_enable_persistent_config: true

# Specify the timezone
open_webui_environment_variables_tz: UTC

# Specify a logging level
# Valid values: CRITICAL, ERROR, WARNING, INFO, DEBUG
open_webui_environment_variables_global_log_level: INFO

# Additional environment variables.
open_webui_environment_variables_additional_variables: ""

# open_webui_restart_necessary controls whether the Open WebUI systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
open_webui_restart_necessary: false
