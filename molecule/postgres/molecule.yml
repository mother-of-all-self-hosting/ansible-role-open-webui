---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: open-webui-${MOLECULE_DISTRO:-ubuntu2604}-postgres
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the instance stores images via containerd. Its storage
      # cannot use overlay on top of the instance's own overlay filesystem, so a
      # volume puts it on a real filesystem.
      - /var/lib/containerd
    # Remove volumes along with the instance, so that local runs do not leave
    # gigabytes behind.
    keep_volumes: false
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        open_webui_debug_service_enabled: false
        open_webui_restarts_check_enabled: true

        # The port on the host that Open WebUI is published on, and which
        # `verify.yml` sends its API requests to.
        open_webui_molecule_http_bind_port: 8080

        # Variables for Open WebUI
        open_webui_uid: 1000
        open_webui_gid: 1000
        open_webui_scheme: http
        open_webui_hostname: localhost
        open_webui_container_labels_traefik_enabled: false
        open_webui_container_http_host_bind_port: "{{ open_webui_molecule_http_bind_port }}"
        open_webui_environment_variables_webui_secret_key: molecule-secret-key

        # Nothing answers at this address. Open WebUI only stores the connection
        # until it is used, which is enough for `verify.yml` to read it back.
        open_webui_environment_variables_ollama_base_url: http://ollama.invalid:11434

        # Variables required for Open WebUI to connect to the Postgres database (via Unix socket)
        open_webui_database_type: postgres
        open_webui_database_username: my_database_username
        open_webui_database_password: my_database_password
        open_webui_database_sslmode: disable
        open_webui_database_name: open_webui
        open_webui_database_socket_enabled: true
        open_webui_database_socket_path_host: "{{ postgres_run_path }}"
        open_webui_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_unix_socket_enabled: true
        postgres_managed_databases: |
          {{
            [{
              'name': open_webui_database_name,
              'username': open_webui_database_username,
              'password': open_webui_database_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
